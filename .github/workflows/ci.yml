# Run automated checks for SaludVital before code integration.
name: SaludVital CI

on:
    pull_request:
        branches:
            - main
            - develop
            - "release/**"
    push:
        branches:
            - main
            - develop
            - "release/**"

permissions:
    contents: read

jobs:
    test:
        name: Tests and Code Quality
        runs-on: ubuntu-latest

        # Start a temporary MySQL server for integration tests.
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: saludvital_test
                    MYSQL_USER: saludvital
                    MYSQL_PASSWORD: saludvital_test_password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            NODE_ENV: test
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_NAME: saludvital_test
            DB_USER: saludvital
            DB_PASSWORD: saludvital_test_password
            JWT_SECRET: ci_test_secret_replace_with_a_long_random_value

        steps:
            # Download the repository source code.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Install the required Node.js version.
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            # Install the exact dependency versions from package-lock.json.
            - name: Install dependencies
              run: npm ci

            # Check JavaScript code quality.
            - name: Run ESLint
              run: npm run lint

            # Prepare the dedicated test database, including migrations and initial roles.
            - name: Prepare test database
              run: npm run db:test:prepare

            # Execute unit and integration tests against the prepared database.
            - name: Run Jest tests
              run: npm test

            # Check formatting without modifying project files.
            - name: Check Prettier formatting
              run: npx prettier --check "app.js" "server.js" "package.json" "config/**/*.js" "tests/**/*.js" "views/**/*.pug" "src/styles/**/*.css" ".github/workflows/ci.yml" --plugin @prettier/plugin-pug

            # Verify that Tailwind CSS compiles successfully.
            - name: Build Tailwind CSS
              run: npm run css:build

            # Install Chromium and its Linux system dependencies.
            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            # Test the homepage, brand colors, responsiveness, and accessibility.
            - name: Run Playwright and accessibility tests
              run: npm run test:e2e
